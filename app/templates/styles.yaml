styles:
  watercolor:
    name: "水彩手绘"
    description: "柔和的水彩风格，温暖治愈"
    vlm_prompt: |
      请分析这张照片，提取以下信息：
      1. 场景描述（地点、环境、氛围）
      2. 情绪感受（温暖、快乐、平静等）
      3. 关键物品（食物、装饰品、自然元素等）
      用温暖治愈的语调描述，输出JSON格式。
    llm_prompt: |
      基于以下内容生成一段温馨的日记文案：

      场景信息：{metadata}
      用户情绪：{user_mood}
      记忆日期：{memory_date}

      要求：
      1. 风格：水彩手绘，温暖治愈
      2. 生成一个简短的标题（caption）
      3. 生成画面描述（scene_description），用于AI绘图
      4. 生成对话气泡文字（bubble_text），简短有趣
      输出JSON格式：{{"caption": "...", "scene_description": "...", "bubble_text": "..."}}
    img_prompt: "水彩手绘风格，{scene_description}，温暖色调，治愈系，细腻笔触，柔和光影"
    bubble_style: "圆润可爱，白色背景，粉色边框"

